<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hot Streak</title>
<meta name="theme-color" content="#8fd8f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hot Streak">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="heat"></div>
  <!-- Opening message -->
  <div id="splash" class="hidden" role="dialog" aria-label="I love you so much! Love, Tim">
    <div class="sp-hearts" aria-hidden="true"></div>
    <div class="sp-body">
      <div class="sp-heart" aria-hidden="true"><svg viewBox="0 0 64 58"><path d="M32 56C10 40 3 30 3 19 3 9.5 10.5 3 19 3c5.6 0 10 2.8 13 7.4C35 5.8 39.4 3 45 3c8.5 0 16 6.5 16 16 0 11-7 21-29 37z"/></svg></div>
      <h1>I love you<br><span>so much!</span></h1>
      <p class="sp-sig">Love, Tim</p>
      <p class="sp-tap">Tap anywhere to play</p>
    </div>
  </div>

  <!-- SETUP -->
  <section id="setup" class="screen active">
    <div class="logo">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <defs>
            <linearGradient id="mkBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset=".5" stop-color="#ff6b3d"/><stop offset="1" stop-color="#f0436a"/></linearGradient>
            <linearGradient id="mkFlame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c2"/><stop offset="1" stop-color="#ffd23f"/></linearGradient>
            <linearGradient id="mkSeven" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#f0436a"/></linearGradient>
          </defs>
          <rect x="4" y="4" width="112" height="112" rx="30" fill="url(#mkBg)"/>
          <ellipse cx="38" cy="26" rx="34" ry="20" fill="#fff" opacity=".16"/>
          <g class="mk-flame" transform="translate(0 -4)">
            <path d="M62 10C71 24 86 32 84 52 83 64 74 70 64 70H56C46 70 37 63 38 51 39 40 47 35 49 26 54 33 56 36 56 42 60 34 63 24 62 10Z" fill="url(#mkFlame)"/>
            <path d="M61 32C66 40 73 45 71 55 70 61 66 64 61 64 55 64 51 60 52 54 53 48 56 46 57 41 59 45 60 47 60 51 62 46 63 39 61 32Z" fill="#fff"/>
          </g>
          <g transform="rotate(-9 60 78)">
            <rect x="32" y="40" width="56" height="74" rx="10" fill="#fff" stroke="rgba(15,42,68,.08)"/>
            <rect x="36.5" y="44.5" width="47" height="65" rx="7" fill="none" stroke="#ffb08a" stroke-width="1.6"/>
            <text x="60" y="95" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="50" font-weight="800" fill="url(#mkSeven)">7</text>
          </g>
          <rect class="mk-shine" x="4" y="4" width="112" height="112" rx="30" fill="url(#mkShine)"/>
          <defs><linearGradient id="mkShine" x1="0" y1="0" x2="1" y2="0"><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset=".65" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
        </svg>
      </div>
      <h1>Hot <span>Streak</span></h1>
      <p class="tag">Flip. Push your luck. Hit seven.</p>
    </div>

    <button id="btnResume" class="resume hidden" aria-label="Continue saved game">Continue saved game</button>
    <button id="btnEndSaved" class="btn ghost end-saved hidden">End this game</button>

    <div class="panel">
      <div class="row between">
        <label>Players</label>
        <div class="stepper">
          <button id="pMinus" aria-label="Fewer players">−</button>
          <span id="pCount">2</span>
          <button id="pPlus" aria-label="More players">+</button>
        </div>
      </div>
      <div id="names"></div>
      <div class="row between">
        <label>Play to</label>
        <div class="seg" id="targetSeg">
          <button data-v="100">100</button><button data-v="150">150</button><button data-v="200" class="on">200</button><button data-v="300">300</button>
        </div>
      </div>
    </div>

    <button id="btnStart" class="btn primary big">Deal the cards</button>
    <button id="btnRules" class="btn link">How to play</button>
  </section>

  <!-- TABLE -->
  <section id="table" class="screen">
    <header class="topbar">
      <div class="tb-left"><span id="roundLbl">Round 1</span><span class="dot">·</span><span id="targetLbl">to 200</span></div>
      <div id="turnPill" class="hidden"></div>
      <button id="btnMenu" class="iconbtn" aria-label="Menu">⋯</button>
    </header>
    <div class="tablebody">
      <aside id="rail"></aside>
      <main id="stage">
        <div id="seats"></div>
        <div id="reveal"></div>
        <div id="stamp"></div>
      </main>
    </div>
    <footer id="controls">
      <button id="btnFlip" class="deckbtn" aria-label="Flip a card"><i class="charge"></i><span>Flip</span></button>
      <button id="btnSkip" class="skipbtn"><b>Skip</b><small id="skipSub">1 per round</small></button>
      <button id="btnClose" class="closebtn"><b>Close</b></button>
    </footer>
  </section>

  <div id="banner"></div>
  <div id="badge"></div>
  <button id="undo" class="hidden"><span>Undo close</span><i></i></button>
  <div id="toast"></div>
  <div id="modalWrap" class="hidden"><div id="modal"></div></div>
  <canvas id="fx"></canvas>
</div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
